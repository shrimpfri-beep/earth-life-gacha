name: 뉴스 수집 (1시간마다)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 뉴스 수집
        run: python scripts/fetch_news.py
      - name: 변경 시 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "뉴스 자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
